route:
  group_by: [ "alertname", "slo" ]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

  routes:
  - match:
      severity: critical
    receiver: "default"
    repeat_interval: 1h

receivers:
- name: "default"
  # Add a webhook, Slack, or PagerDuty receiver here when ready.
  # Example Slack config (uncomment and fill in):
  # slack_configs:
  #   - api_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  #     channel: "#alerts"
  #     title: "{{ .GroupLabels.alertname }}"
  #     text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"

inhibit_rules:
- source_match:
    severity: critical
  target_match:
    severity: warning
  equal: [ "alertname" ]
