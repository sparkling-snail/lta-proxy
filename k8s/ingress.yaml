# Requires AWS Load Balancer Controller to be installed on the cluster.
# Install it first:
#   helm repo add eks https://aws.github.io/eks-charts
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system \
#     --set clusterName=lta-proxy \
#     --set serviceAccount.create=true
#
# The ALB routes:
#   /arrivals/*  → lta-proxy backend (FastAPI)
#   /health      → lta-proxy backend
#   /metrics     → lta-proxy backend
#   /*           → lta-proxy-frontend (React/nginx)
#
# The React app uses relative paths (/arrivals/*) so no CORS needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lta-proxy
  namespace: lta-proxy
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  rules:
    - http:
        paths:
          - path: /arrivals
            pathType: Prefix
            backend:
              service:
                name: lta-proxy
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: lta-proxy
                port:
                  number: 8000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: lta-proxy
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lta-proxy-frontend
                port:
                  number: 80
