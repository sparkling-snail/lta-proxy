apiVersion: apps/v1
kind: Deployment
metadata:
  name: lta-proxy
  namespace: lta-proxy
  labels:
    app: lta-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lta-proxy
  template:
    metadata:
      labels:
        app: lta-proxy
    spec:
      containers:
        - name: app
          # CI/CD replaces this with the SHA-tagged ECR image.
          # Get the registry URL from: terraform output app_ecr_url
          image: REPLACE_WITH_ECR_APP_URL:latest
          ports:
            - containerPort: 8000
          env:
            - name: LTA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lta-proxy-secret
                  key: LTA_API_KEY
          envFrom:
            - configMapRef:
                name: lta-proxy-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
