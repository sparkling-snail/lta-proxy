# =============================================================================
# INPUT — where Logstash reads logs from
# =============================================================================
input {
  file {
    path => "/logs/app.log"        # shared volume mounted from the app container
    start_position => "beginning"  # on first run, read from line 1 not the tail
    sincedb_path => "/dev/null"    # don't remember position between restarts (dev only)
    codec => "json"                # each line is already JSON — parse it directly
    tags => ["lta-proxy"]
  }
}

# =============================================================================
# FILTER — transform and enrich the log data before storing
# =============================================================================
filter {

  # Use the app's timestamp as the Elasticsearch document timestamp
  # Without this, Elasticsearch uses when Logstash received the log (wrong)
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Convert status code from string "200" to integer 200
  # Allows range queries in Kibana: status >= 400
  if [status] {
    mutate {
      convert => { "status" => "integer" }
    }
  }

  # Convert duration_ms to float for numeric aggregations
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "float" }
    }
  }

  # Tag error logs so they're easy to filter in Kibana
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error"]
    }
  }

  # Tag slow requests (over 300ms) for performance investigation
  if [duration_ms] and [duration_ms] > 300 {
    mutate {
      add_tag => ["slow"]
    }
  }

  # Tag cache misses — useful for seeing LTA call patterns
  if [cache] == "miss" {
    mutate {
      add_tag => ["cache_miss"]
    }
  }

  if [cache] == "stale" {
    mutate {
      add_tag => ["stale_cache"]
    }
  }

}

# =============================================================================
# OUTPUT — where Logstash sends the processed logs
# =============================================================================
output {

  # Send to Elasticsearch — one index per day for easy cleanup
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "lta-proxy-%{+YYYY.MM.dd}"
  }

  # Also print to Logstash stdout — visible in `docker compose logs logstash`
  # Remove this in production to reduce noise
  stdout {
    codec => rubydebug
  }

}
