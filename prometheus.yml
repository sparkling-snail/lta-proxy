global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
  - static_configs:
    - targets: [ "alertmanager:9093" ]

rule_files:
- "alerts.yml"

scrape_configs:
- job_name: lta-proxy
  scrape_timeout: 2s # fail scrape if it takes more than 2s
  static_configs:
  - targets: [ "app:8000" ]
  metrics_path: /metrics

- job_name: node-exporter
  static_configs:
  - targets: [ "node-exporter:9100" ]
